{# Feed card. Expects `story`. #}
<article class="flex flex-col rounded-xl border border-neutral-200 bg-white p-4 shadow-sm transition hover:shadow-md">
  <div class="mb-2 flex items-center gap-2">
    {% include "partials/_blindspot_badge.html" %}
    <span class="ml-auto text-[11px] text-neutral-400">{{ story.updated_at | timeago }}</span>
  </div>
  <a href="{{ url_for('story.detail', slug=story.slug) }}"
     class="block text-base font-semibold leading-snug text-neutral-900 hover:text-brand-600">
    {{ story.canonical_title }}
  </a>
  {% if story.ai_summary %}
    <p class="mt-1 line-clamp-2 text-sm text-neutral-500">{{ story.ai_summary }}</p>
  {% endif %}
  <div class="mt-auto pt-3">{% include "partials/_bias_bar.html" %}</div>
  <div class="mt-2">{% include "partials/_source_chips.html" %}</div>
</article>
